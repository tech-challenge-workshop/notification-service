name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The persistence suite guards itself with `DATABASE_HOST ? describe :
    # describe.skip`. Without a database here it skipped silently and the
    # check stayed green, so the durable delivery record was never verified
    # in CI. The database below and the skip guard after the e2e run close
    # that together.
    # The broker is loaded with the platform's definitions before the e2e
    # run (see below), so the broker suite finds the stack's own queues. The
    # management port serves that import.
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fiapx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fiapx"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: fiapx
      DATABASE_SCHEMA: notification
      DATABASE_USER: notification
      DATABASE_PASSWORD: notification
    steps:
      - uses: actions/checkout@v4
      # The schema and role come from the platform's bootstrap, the same file
      # the local topology runs, so CI cannot drift from what the stack uses.
      # The repository is public, so no token is needed.
      - uses: actions/checkout@v4
        with:
          repository: tech-challenge-workshop/fiap-x-platform
          path: .platform
          sparse-checkout: |
            db/init
            rabbitmq
      - name: Bootstrap the database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fiapx -v ON_ERROR_STOP=1 -f .platform/db/init/01-schemas.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      # The broker e2e suite needs the stack's topology, and fails rather
      # than skips in CI when RABBITMQ_TEST_URL is unset. definitions.json is
      # the file the platform's rabbitmq.conf loads with load_definitions;
      # importing it through the management API sets the vhost's quorum
      # default, every queue and its .dlq, and the dead-letter policy, as the
      # Worker's CI does.
      - name: Load the platform's broker definitions
        run: |
          # The health check pings the node; the management API can take a
          # few more seconds to accept requests.
          for i in $(seq 1 30); do
            curl -fsS -u guest:guest -H 'content-type: application/json' \
              -X POST --data @.platform/rabbitmq/definitions.json \
              http://localhost:15672/api/definitions && break
            sleep 2
          done
          curl -fsS -u guest:guest http://localhost:15672/api/queues/%2F/notification.terminal.dlq >/dev/null
      - run: npm run test:e2e -- --json --outputFile=e2e-results.json
        env:
          RABBITMQ_TEST_URL: amqp://guest:guest@localhost:5672
      - name: Fail if any e2e test was skipped
        run: |
          node -e '
            const r = require("./e2e-results.json");
            const skipped = r.numPendingTests + r.numTodoTests;
            console.log(r.numPassedTests + " passed, " + skipped + " skipped");
            if (skipped > 0) {
              console.error("e2e tests were skipped - a green run would not mean they passed");
              process.exit(1);
            }
          '
      - run: npm run build
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  image:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        run: docker build -t ${{ github.event.repository.name }}:ci .
